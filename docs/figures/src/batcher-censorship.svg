<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500">
  <!-- theme -->
  <defs>
    <marker id="arrow-txs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="m-txs" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="arrow-digests" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="m-digests" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>

  <!-- Consensus: every consenter -->
  <text class="group-label" x="920" y="484">Consensus</text>
  <rect class="group consensus" x="860" y="110" width="120" height="350" rx="14"/>
  <rect class="node" x="890" y="135" width="60" height="40"/><text class="node-label" x="920" y="163">C1</text>
  <rect class="node" x="890" y="215" width="60" height="40"/><text class="node-label" x="920" y="243">C2</text>
  <rect class="node" x="890" y="295" width="60" height="40"/><text class="node-label" x="920" y="323">C3</text>
  <rect class="node" x="890" y="375" width="60" height="40"/><text class="node-label" x="920" y="403">C4</text>

  <!-- Party 1's router -->
  <rect class="node" x="20" y="256" width="70" height="44"/><text class="node-label" x="55" y="286">R1</text>

  <!-- The censoring primary, B1 -->
  <text class="primary" x="148" y="98">★</text>
  <text class="group-label start" x="162" y="98">B1 (primary)</text>
  <rect class="group frame" x="120" y="110" width="260" height="350" rx="14"/>
  <rect class="node" x="150" y="250" width="200" height="56"/>
  <text class="node-label-small" x="250" y="274">Mempool</text><text class="note" x="250" y="293">tx4 — never batched</text>

  <!-- The secondaries, B2..B4, each holding tx4 -->
  <text class="group-label start" x="510" y="98">B2 (secondary, next primary)</text>
  <rect class="group frame" x="500" y="110" width="260" height="100" rx="14"/>
  <rect class="node" x="530" y="132" width="200" height="56"/>
  <text class="node-label-small" x="630" y="156">Mempool</text><text class="note" x="630" y="175">tx4 — pending</text>

  <text class="group-label start" x="510" y="225">B3 (secondary)</text>
  <rect class="group frame" x="500" y="235" width="260" height="100" rx="14"/>
  <rect class="node" x="530" y="257" width="200" height="56"/>
  <text class="node-label-small" x="630" y="281">Mempool</text><text class="note" x="630" y="300">tx4 — pending</text>

  <text class="group-label start" x="510" y="350">B4 (secondary)</text>
  <rect class="group frame" x="500" y="360" width="260" height="100" rx="14"/>
  <rect class="node" x="530" y="382" width="200" height="56"/>
  <text class="node-label-small" x="630" y="406">Mempool</text><text class="note" x="630" y="425">tx4 — pending</text>

  <!-- tx4 reaches B1 from its router -->
  <line class="flow txs" x1="90" y1="278" x2="148" y2="278" marker-end="url(#arrow-txs)"/>
  <text class="flow-label txs small" x="119" y="268">tx4</text>

  <!-- 1: first strike, each secondary forwards tx4 to the primary -->
  <path class="flow txs" d="M528,160 H440 V410 H528"/>
  <line class="flow txs" x1="528" y1="285" x2="440" y2="285"/>
  <line class="flow txs" x1="440" y1="278" x2="352" y2="278" marker-end="url(#arrow-txs)"/>
  <text class="flow-label txs small" x="396" y="268">① forward</text>

  <!-- 2: second strike, each secondary complains to every consenter -->
  <line class="flow digests" x1="732" y1="150" x2="858" y2="150" marker-end="url(#arrow-digests)"/>
  <line class="flow digests" x1="732" y1="275" x2="858" y2="275" marker-end="url(#arrow-digests)"/>
  <line class="flow digests" x1="732" y1="400" x2="858" y2="400" marker-end="url(#arrow-digests)"/>
  <text class="flow-label digests small" x="809" y="140">② complaint</text>

  <!-- 3: f+1 complaints, the consenters increment the term; every batcher learns it from its decisions -->
  <line class="flow digests dashed" x1="858" y1="172" x2="762" y2="172" marker-end="url(#arrow-digests)"/>
  <line class="flow digests dashed" x1="858" y1="297" x2="762" y2="297" marker-end="url(#arrow-digests)"/>
  <line class="flow digests dashed" x1="858" y1="422" x2="762" y2="422" marker-end="url(#arrow-digests)"/>
  <path class="flow digests dashed" d="M920,108 V40 H340 V108" marker-end="url(#arrow-digests)"/>
  <text class="flow-label digests small" x="630" y="32">③ term change</text>
</svg>
