<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500">
  <!-- theme -->
  <defs>
    <marker id="arrow-txs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="m-txs" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="arrow-digests" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="m-digests" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="arrow-batches" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="m-batches" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="arrow-control" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="m-control" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>

  <!-- Consensus: every consenter -->
  <text class="group-label" x="920" y="484">Consensus</text>
  <rect class="group consensus" x="860" y="110" width="120" height="350" rx="14"/>
  <rect class="node" x="890" y="135" width="60" height="40"/><text class="node-label" x="920" y="163">C1</text>
  <rect class="node" x="890" y="215" width="60" height="40"/><text class="node-label" x="920" y="243">C2</text>
  <rect class="node" x="890" y="295" width="60" height="40"/><text class="node-label" x="920" y="323">C3</text>
  <rect class="node" x="890" y="375" width="60" height="40"/><text class="node-label" x="920" y="403">C4</text>

  <!-- Party 1's router -->
  <rect class="node" x="20" y="133" width="70" height="44"/><text class="node-label" x="55" y="163">R1</text>

  <!-- The primary, B1: mempool, the batch it cuts, its ledger -->
  <text class="primary" x="148" y="98">★</text>
  <text class="group-label start" x="162" y="98">B1 (primary)</text>
  <rect class="group frame" x="120" y="110" width="260" height="350" rx="14"/>
  <rect class="node" x="150" y="130" width="200" height="56"/>
  <text class="node-label-small" x="250" y="154">Mempool</text><text class="note" x="250" y="173">tx1, tx2, tx3, …</text>
  <rect class="node batches" x="150" y="250" width="200" height="56"/>
  <text class="node-label-small" x="250" y="274">batch</text><text class="note" x="250" y="293">⟨shard 1, B1, seq 0⟩</text>
  <path class="ledger" d="M225,370 v50 a25,7 0 0 0 50,0 v-50"/>
  <ellipse class="ledger" cx="250" cy="370" rx="25" ry="7"/>
  <text class="note start" x="285" y="400">ledger</text>

  <!-- The secondaries, B2..B4: the batch they pulled, their ledgers -->
  <text class="group-label start" x="510" y="98">B2 (secondary)</text>
  <rect class="group frame" x="500" y="110" width="260" height="100" rx="14"/>
  <rect class="node batches" x="520" y="132" width="120" height="56"/>
  <text class="node-label-small" x="580" y="156">batch</text><text class="note" x="580" y="175">verified</text>
  <path class="ledger" d="M695,140 v40 a25,7 0 0 0 50,0 v-40"/>
  <ellipse class="ledger" cx="720" cy="140" rx="25" ry="7"/>

  <text class="group-label start" x="510" y="225">B3 (secondary)</text>
  <rect class="group frame" x="500" y="235" width="260" height="100" rx="14"/>
  <rect class="node batches" x="520" y="257" width="120" height="56"/>
  <text class="node-label-small" x="580" y="281">batch</text><text class="note" x="580" y="300">verified</text>
  <path class="ledger" d="M695,265 v40 a25,7 0 0 0 50,0 v-40"/>
  <ellipse class="ledger" cx="720" cy="265" rx="25" ry="7"/>

  <text class="group-label start" x="510" y="350">B4 (secondary)</text>
  <rect class="group frame" x="500" y="360" width="260" height="100" rx="14"/>
  <rect class="node batches" x="520" y="382" width="120" height="56"/>
  <text class="node-label-small" x="580" y="406">batch</text><text class="note" x="580" y="425">verified</text>
  <path class="ledger" d="M695,390 v40 a25,7 0 0 0 50,0 v-40"/>
  <ellipse class="ledger" cx="720" cy="390" rx="25" ry="7"/>

  <!-- 1: the primary cuts the batch; 2: stores it and sends its BAF -->
  <line class="flow txs" x1="90" y1="155" x2="148" y2="155" marker-end="url(#arrow-txs)"/>
  <text class="flow-label txs small" x="119" y="145">txs</text>
  <line class="flow batches" x1="250" y1="186" x2="250" y2="248" marker-end="url(#arrow-batches)"/>
  <text class="flow-label batches small start" x="258" y="222">① cut</text>
  <line class="flow batches" x1="250" y1="306" x2="250" y2="361" marker-end="url(#arrow-batches)"/>
  <text class="flow-label batches small start" x="258" y="338">② store</text>
  <path class="flow digests" d="M275,378 H400 V40 H920 V108" marker-end="url(#arrow-digests)"/>
  <text class="flow-label digests small" x="640" y="32">② BAF</text>

  <!-- 3: each secondary pulls the batch from the primary's ledger -->
  <path class="flow batches" d="M275,410 H440 V150 H518" marker-end="url(#arrow-batches)"/>
  <line class="flow batches" x1="440" y1="275" x2="518" y2="275" marker-end="url(#arrow-batches)"/>
  <line class="flow batches" x1="440" y1="410" x2="518" y2="410" marker-end="url(#arrow-batches)"/>
  <text class="flow-label batches small" x="480" y="140">③ pull</text>

  <!-- 4: each secondary verifies and stores it, and sends its BAF -->
  <line class="flow batches" x1="640" y1="160" x2="693" y2="160" marker-end="url(#arrow-batches)"/>
  <line class="flow batches" x1="640" y1="285" x2="693" y2="285" marker-end="url(#arrow-batches)"/>
  <line class="flow batches" x1="640" y1="410" x2="693" y2="410" marker-end="url(#arrow-batches)"/>
  <text class="flow-label batches small" x="667" y="128">④ store</text>
  <line class="flow digests" x1="760" y1="160" x2="858" y2="160" marker-end="url(#arrow-digests)"/>
  <line class="flow digests" x1="760" y1="285" x2="858" y2="285" marker-end="url(#arrow-digests)"/>
  <line class="flow digests" x1="760" y1="410" x2="858" y2="410" marker-end="url(#arrow-digests)"/>
  <text class="flow-label digests small" x="809" y="150">④ BAF</text>

  <!-- 5: and acks to the primary -->
  <path class="flow control" d="M518,175 H460 V440 H382" marker-end="url(#arrow-control)"/>
  <line class="flow control" x1="518" y1="300" x2="460" y2="300"/>
  <line class="flow control" x1="518" y1="425" x2="460" y2="425"/>
  <text class="flow-label control small" x="420" y="458">⑤ acks</text>
</svg>
