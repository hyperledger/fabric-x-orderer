<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 525" width="1000" height="525">
  <!-- theme -->
  <defs>
    <marker id="arrow-digests" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="m-digests" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="arrow-batches" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="m-batches" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>

  <!-- One decision: its BAs are blocks with a header and metadata, and no data; tinted like the fields they become -->
  <text class="group-label" x="145" y="128">One decision</text>
  <rect class="group frame" x="40" y="140" width="210" height="335" rx="14"/>
  <rect class="node consensus" x="65" y="165" width="160" height="50"/>
  <text class="node-label-small" x="145" y="197">BA<tspan class="node-sub">0</tspan></text>
  <rect class="node consensus" x="65" y="330" width="160" height="50"/>
  <text class="node-label-small" x="145" y="362">BA<tspan class="node-sub">1</tspan></text>
  <rect class="node consensus" x="65" y="400" width="160" height="50"/>
  <text class="node-label-small" x="145" y="432">BA<tspan class="node-sub">2</tspan></text>
  <text class="note" x="145" y="497">each BA is a block with no data,</text>
  <text class="note" x="145" y="513">signed by a quorum of consenters</text>

  <!-- The block ledger: one block per BA, in the decision's order -->
  <text class="group-label" x="590" y="48">Block ledger</text>
  <rect class="group frame" x="410" y="60" width="360" height="410" rx="14"/>

  <!-- Block h, field by field; fields tinted like the decision come from consensus, the Data field from the batch -->
  <rect class="node" x="425" y="80" width="330" height="220"/>
  <text class="node-label-small" x="590" y="104">Block h</text>
  <rect class="node consensus" x="435" y="115" width="310" height="45"/>
  <text class="node-label-small" x="590" y="135">Header</text><text class="note" x="590" y="153">number, previous hash, data hash</text>
  <rect class="node batches" x="435" y="160" width="310" height="45"/>
  <text class="node-label-small" x="590" y="180">Data</text><text class="note" x="590" y="198">the batch's requests</text>
  <rect class="node consensus" x="435" y="205" width="310" height="45"/>
  <text class="node-label-small" x="590" y="225">Metadata: orderer</text><text class="note" x="590" y="243">batchID and its place in the decision</text>
  <rect class="node consensus" x="435" y="250" width="310" height="45"/>
  <text class="node-label-small" x="590" y="270">Metadata: signatures</text><text class="note" x="590" y="288">a quorum's signatures over header and metadata</text>

  <!-- The next BAs of the decision become the next blocks -->
  <rect class="node" x="425" y="330" width="330" height="50"/><text class="node-label-small" x="590" y="361">Block h+1</text>
  <rect class="node" x="425" y="400" width="330" height="50"/><text class="node-label-small" x="590" y="431">Block h+2</text>

  <!-- BA i -> block h+i -->
  <line class="flow digests" x1="225" y1="190" x2="423" y2="190" marker-end="url(#arrow-digests)"/>
  <text class="flow-label digests small" x="324" y="176">header and metadata</text>
  <line class="flow digests" x1="225" y1="355" x2="423" y2="355" marker-end="url(#arrow-digests)"/>
  <line class="flow digests" x1="225" y1="425" x2="423" y2="425" marker-end="url(#arrow-digests)"/>

  <!-- The batch supplies the data; its digest is the header's data hash -->
  <rect class="node batches" x="855" y="160" width="130" height="45"/><text class="node-label-small" x="920" y="189">Batch</text>
  <text class="note" x="920" y="227">its digest is the</text>
  <text class="note" x="920" y="243">header's data hash</text>
  <line class="flow batches" x1="853" y1="182" x2="749" y2="182" marker-end="url(#arrow-batches)"/>
  <text class="flow-label batches small" x="812" y="168">requests</text>
</svg>
