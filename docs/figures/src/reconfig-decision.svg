<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="1000" height="580">
  <!-- theme -->
  <defs>
    <marker id="arrow-blocks" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="m-blocks" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="arrow-digests" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="m-digests" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>

  <!-- A filled panel behind the whole figure, so every arrow and label is readable on a light or a dark page -->
  <rect class="group shard-1" x="10" y="10" width="980" height="560" rx="14"/>

  <!-- The checks, top to bottom, in the order the code runs them -->
  <rect class="node" x="140" y="30" width="340" height="56"/>
  <text class="node-label-small" x="310" y="54">New config block pulled</text><text class="note" x="310" y="73">soft stop, then config ack (see Figure 2)</text>
  <line class="flow blocks" x1="310" y1="86" x2="310" y2="120" marker-end="url(#arrow-blocks)"/>

  <rect class="node dashed" x="140" y="122" width="340" height="70"/>
  <text class="node-label-small" x="310" y="147">Batchers only:</text>
  <text class="note" x="310" y="166">did a batching parameter used</text><text class="note" x="310" y="182">by the mempool change?</text>
  <line class="flow blocks" x1="310" y1="192" x2="310" y2="226" marker-end="url(#arrow-blocks)"/>
  <text class="flow-label blocks start small" x="320" y="214">no</text>

  <rect class="node" x="140" y="228" width="340" height="56"/>
  <text class="node-label-small" x="310" y="252">Was its party removed?</text><text class="note" x="310" y="271">all node types</text>
  <line class="flow blocks" x1="310" y1="284" x2="310" y2="318" marker-end="url(#arrow-blocks)"/>
  <text class="flow-label blocks start small" x="320" y="306">no</text>

  <rect class="node" x="140" y="320" width="340" height="70"/>
  <text class="node-label-small" x="310" y="345">Did its own identity change?</text>
  <text class="note" x="310" y="364">host or port, TLS certificate,</text><text class="note" x="310" y="380">or signing certificate</text>
  <line class="flow blocks" x1="310" y1="390" x2="310" y2="430" marker-end="url(#arrow-blocks)"/>
  <text class="flow-label blocks start small" x="320" y="414">no</text>

  <!-- Dynamic restart -->
  <rect class="node shard-2" x="140" y="432" width="340" height="80"/>
  <text class="node-label-small" x="310" y="458">Dynamic restart</text>
  <text class="note" x="310" y="478">applies config N in-process;</text>
  <text class="note" x="310" y="496">a batcher keeps and prunes its mempool</text>

  <!-- Pending admin: any yes -->
  <rect class="node consensus" x="640" y="192" width="330" height="128"/>
  <text class="node-label-small" x="805" y="220">Pending admin</text>
  <text class="note" x="805" y="242">stays soft-stopped; logs the reason and</text>
  <text class="note" x="805" y="260">"Pending admin action to apply new config";</text>
  <text class="note" x="805" y="278">the admin restarts it</text>
  <text class="note" x="805" y="300">a batcher restarts with an empty mempool</text>
  <line class="flow digests" x1="480" y1="157" x2="560" y2="157"/>
  <line class="flow digests" x1="480" y1="256" x2="638" y2="256" marker-end="url(#arrow-digests)"/>
  <line class="flow digests" x1="480" y1="355" x2="560" y2="355"/>
  <line class="flow digests" x1="560" y1="157" x2="560" y2="355"/>
  <text class="flow-label digests small" x="520" y="147">yes</text>
  <text class="flow-label digests small" x="520" y="246">yes</text>
  <text class="flow-label digests small" x="520" y="345">yes</text>

  <!-- The first yes decides; in a box so the text is readable on either page -->
  <rect class="node" x="40" y="520" width="920" height="40"/>
  <text class="note" x="500" y="536">The node stops at the first "yes", and logs only that reason: a batcher that sees a mempool change</text>
  <text class="note" x="500" y="552">does not also report an identity change made in the same config TX.</text>
</svg>
