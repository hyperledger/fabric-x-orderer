<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 590" width="1000" height="590">
  <!-- theme -->
  <defs>
    <marker id="arrow-digests" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="m-digests" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="arrow-batches" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="m-batches" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="arrow-blocks" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="m-blocks" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="arrow-requests" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="m-requests" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>

  <!-- The assembler node -->
  <text class="group-label" x="532" y="40">Assembler A1</text>
  <rect class="group frame" x="200" y="52" width="665" height="523" rx="14"/>

  <!-- Outside the node -->
  <rect class="node" x="25" y="93" width="80" height="44"/><text class="node-label" x="65" y="123">C1</text>
  <rect class="node" x="15" y="498" width="110" height="44"/><text class="node-label-small" x="70" y="526">Batchers</text>
  <rect class="node" x="895" y="93" width="100" height="44"/><text class="node-label-small" x="945" y="121">Clients</text>

  <!-- Row 1: the decision path and the output -->
  <rect class="node" x="215" y="93" width="140" height="44"/>
  <text class="node-label-small" x="285" y="121">BA replicator</text>
  <rect class="node" x="405" y="93" width="140" height="44"/>
  <text class="node-label-small" x="475" y="121">Collator</text>
  <path class="ledger" d="M600,96 v38 a25,7 0 0 0 50,0 v-38"/>
  <ellipse class="ledger" cx="625" cy="96" rx="25" ry="7"/>
  <text class="note" x="625" y="162">ledger</text>
  <rect class="node" x="693" y="93" width="150" height="44"/>
  <text class="node-label-small" x="768" y="121">Deliver service</text>

  <!-- Row 2: the index -->
  <rect class="node" x="255" y="255" width="440" height="60"/>
  <text class="node-label-small" x="475" y="281">Index</text><text class="note" x="475" y="302">⟨shard, primary⟩ partitions</text>

  <!-- Row 3: the prefetcher's two loops -->
  <rect class="node" x="255" y="375" width="160" height="60"/>
  <text class="node-label-small" x="335" y="411">Stream loop</text>
  <rect class="node" x="535" y="375" width="160" height="60"/>
  <text class="node-label-small" x="615" y="411">Request loop</text>
  <rect class="group frame" x="243" y="363" width="464" height="84" rx="10"/>
  <text class="note start" x="715" y="409">Prefetcher</text>

  <!-- Row 4: the batch fetcher -->
  <rect class="node" x="255" y="490" width="440" height="60"/>
  <text class="node-label-small" x="475" y="516">Batch fetcher</text><text class="note" x="475" y="537">streams and on-demand pulls from the batchers</text>

  <!-- Decisions: C1 -> BA replicator -> collator -->
  <line class="flow digests" x1="105" y1="115" x2="213" y2="115" marker-end="url(#arrow-digests)"/>
  <text class="flow-label digests small" x="159" y="100">decisions</text>
  <line class="flow digests" x1="355" y1="115" x2="403" y2="115" marker-end="url(#arrow-digests)"/>
  <text class="flow-label digests small" x="379" y="100">BAs</text>

  <!-- Blocks: collator -> ledger -> Deliver service -> clients -->
  <line class="flow blocks" x1="545" y1="115" x2="598" y2="115" marker-end="url(#arrow-blocks)"/>
  <text class="flow-label blocks small" x="571" y="100">append</text>
  <line class="flow blocks" x1="650" y1="115" x2="691" y2="115" marker-end="url(#arrow-blocks)"/>
  <line class="flow blocks" x1="843" y1="115" x2="893" y2="115" marker-end="url(#arrow-blocks)"/>
  <text class="flow-label blocks small" x="868" y="100">blocks</text>

  <!-- The collator asks the index for a batch by its batchID, and gets the batch back -->
  <line class="flow requests" x1="450" y1="139" x2="450" y2="253" marker-end="url(#arrow-requests)"/>
  <text class="flow-label requests end small" x="442" y="205">PopOrWait(batchID)</text>
  <line class="flow batches" x1="500" y1="253" x2="500" y2="139" marker-end="url(#arrow-batches)"/>
  <text class="flow-label batches start small" x="508" y="205">batch</text>

  <!-- Streamed batches: batchers -> batch fetcher -> stream loop -> index -->
  <line class="flow batches" x1="125" y1="520" x2="253" y2="520" marker-end="url(#arrow-batches)"/>
  <text class="flow-label batches small" x="162" y="511">batches</text>
  <line class="flow batches" x1="335" y1="488" x2="335" y2="437" marker-end="url(#arrow-batches)"/>
  <text class="flow-label batches end small" x="327" y="467">Replicate</text>
  <line class="flow batches" x1="335" y1="373" x2="335" y2="317" marker-end="url(#arrow-batches)"/>
  <text class="flow-label batches end small" x="327" y="350">Put</text>

  <!-- On-demand: index -> request loop -> batch fetcher, and the batch back into the index -->
  <line class="flow requests" x1="590" y1="317" x2="590" y2="373" marker-end="url(#arrow-requests)"/>
  <text class="flow-label requests end small" x="582" y="350">batchID</text>
  <line class="flow batches" x1="640" y1="373" x2="640" y2="317" marker-end="url(#arrow-batches)"/>
  <text class="flow-label batches start small" x="648" y="350">PutForce</text>
  <line class="flow requests" x1="590" y1="437" x2="590" y2="488" marker-end="url(#arrow-requests)"/>
  <text class="flow-label requests end small" x="582" y="467">GetBatch(batchID)</text>
  <line class="flow batches" x1="640" y1="488" x2="640" y2="437" marker-end="url(#arrow-batches)"/>
  <text class="flow-label batches start small" x="648" y="467">batch</text>
</svg>
