################################################################################
#
#    Arma Router Configuration Template
#
################################################################################

# PartyID a unique identifier for each Arma party, uint16, id>0
PartyID: 1

################################################################################
#
#   SECTION: General: same as in template
#
################################################################################
General:

################################################################################
#
#   SECTION: File Store: same as in template
#
################################################################################
FileStore:

################################################################################
#
#   SECTION: Role specific configuration: only `Router` key
#
################################################################################

# Router specific parameters
Router:
  NumberOfConnectionsPerBatcher: 10
  NumberOfStreamsPerConnection: 20
  # Throttling configures request rate limiting on the router's ingress.
  # If the Throttling block is omitted entirely, throttling is disabled.
  Throttling:
    # Policy selects the throttling strategy:
    #   disabled - no throttling (default)
    #   global   - a single aggregate rate limit shared by all clients on this router
    Policy: disabled
    # Rate is the aggregate cap, in requests per second, across all clients
    # (used by the global policy). 0 disables throttling.
    Rate: 0
    # Burst is the token-bucket capacity (the largest momentary burst admitted).
    # When 0 it defaults to Rate, i.e. one second's worth of tokens.
    Burst: 0
