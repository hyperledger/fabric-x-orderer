name: Integration Tests
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

env:
  GOPATH: /opt/go
  PATH: /opt/go/bin:/bin:/usr/bin:/sbin:/usr/sbin:/usr/local/bin:/usr/local/sbin

permissions:
  contents: read # to fetch code (actions/checkout)

jobs:
  integration-reconfig-membership-full-parties-replacement:
    name: Reconfig Membership Full Parties Replacement
    runs-on: ${{ github.repository == 'hyperledger/fabric-x-orderer' && 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
        name: Checkout Fabric-X Code
      - uses: actions/setup-go@v6
        name: Install Go
        with:
          go-version-file: go.mod
      - run: make integration-reconfig-membership-full-parties-replacement
        name: Run Integration Reconfig Membership Full Parties Replacement
  integration-reconfig-membership-rejoin-single-party:
    name: Reconfig Membership Rejoin Single Party
    runs-on: ${{ github.repository == 'hyperledger/fabric-x-orderer' && 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
        name: Checkout Fabric-X Code
      - uses: actions/setup-go@v6
        name: Install Go
        with:
          go-version-file: go.mod
      - run: make integration-reconfig-membership-rejoin-single-party
        name: Run Integration Reconfig Membership Rejoin Single Party
  integration-basic:
    name: Integration Basic Tests
    runs-on: ${{ github.repository == 'hyperledger/fabric-x-orderer' && 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
        name: Checkout Fabric-X Code
      - uses: actions/setup-go@v6
        name: Install Go
        with:
          go-version-file: go.mod
      - run: make integration-basic
        name: Run Integration Basic Tests
  integration-faulttolerance:
    name: Integration Fault Tolerance Tests
    runs-on: ${{ github.repository == 'hyperledger/fabric-x-orderer' && 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
        name: Checkout Fabric-X Code
      - uses: actions/setup-go@v6
        name: Install Go
        with:
          go-version-file: go.mod
      - run: make integration-faulttolerance
        name: Run Integration Fault Tolerance Tests
  integration-reconfig:
    name: ${{ matrix.name }}
    runs-on: ${{ github.repository == 'hyperledger/fabric-x-orderer' && 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Reconfig Membership Tests
            target: integration-reconfig-membership
          - name: Reconfig Identity Tests
            target: integration-reconfig-identity
          - name: Reconfig Endpoints Tests
            target: integration-reconfig-endpoints
          - name: Reconfig Params Tests
            target: integration-reconfig-params
          - name: Reconfig Configtx Tests
            target: integration-reconfig-configtx
    steps:
      - uses: actions/checkout@v5
        name: Checkout Fabric-X Code
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        name: Install Go
        with:
          go-version-file: go.mod
      - run: make ${{ matrix.target }}
        name: Run ${{ matrix.name }}
