---
name: Release Binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.0.0). Re-runs an existing release."
        required: true

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Validate Tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.extract.outputs.tag }}
      make_latest: ${{ steps.extract.outputs.make_latest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Extract and validate version from tag
        id: extract
        env:
          RAW_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ "${RAW_TAG}" =~ ^v([0-9]+\.[0-9]+\.[0-9]+.*)$ ]]; then
            echo "tag=${RAW_TAG}" >> "$GITHUB_OUTPUT"
            echo "Tag validated: ${RAW_TAG}"
          else
            echo "Invalid tag format: ${RAW_TAG}. Expected format: v<semver>"
            exit 1
          fi

          # Compute make_latest: true only when this tag's MAJOR.MINOR is the
          # highest across all existing vX.Y.* tags (backports stay false).
          THIS_MINOR="${RAW_TAG%%.*}.${RAW_TAG#*.}"   # vX.Y
          THIS_MINOR="${THIS_MINOR%%.*}.${THIS_MINOR#*.}"
          THIS_MINOR="${RAW_TAG#v}"                   # X.Y.Z…
          THIS_MAJOR="${THIS_MINOR%%.*}"              # X
          THIS_MINOR="${THIS_MINOR#*.}"               # Y.Z…
          THIS_MINOR="${THIS_MINOR%%.*}"              # Y

          HIGHEST=$(git ls-remote --tags origin 'refs/tags/v*' \
            | awk -F'/' '{print $NF}' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sed 's/^v//' \
            | sort -t. -k1,1n -k2,2n -k3,3n \
            | tail -1)

          if [[ -n "${HIGHEST}" ]]; then
            HIGH_MAJOR="${HIGHEST%%.*}"
            HIGH_MINOR="${HIGHEST#*.}"; HIGH_MINOR="${HIGH_MINOR%%.*}"
            HIGH_PATCH="${HIGHEST##*.}"
            THIS_PATCH="${RAW_TAG#*.*.}"
            THIS_PATCH="${THIS_PATCH%%[!0-9]*}"
            if (( THIS_MAJOR > HIGH_MAJOR )) || \
               (( THIS_MAJOR == HIGH_MAJOR && THIS_MINOR > HIGH_MINOR )) || \
               (( THIS_MAJOR == HIGH_MAJOR && THIS_MINOR == HIGH_MINOR && THIS_PATCH >= HIGH_PATCH )); then
              echo "make_latest=true"  >> "$GITHUB_OUTPUT"
            else
              echo "make_latest=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "make_latest=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build (${{ matrix.os }}/${{ matrix.arch }})
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
          - os: linux
            arch: s390x
          - os: darwin
            arch: amd64
          - os: darwin
            arch: arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Build and package binaries
        env:
          TARGET: ${{ matrix.os }}-${{ matrix.arch }}
          RELEASE: ${{ needs.prepare.outputs.tag }}
        run: bash ./scripts/create-binary-package.sh

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: fabric-x-orderer-${{ matrix.os }}-${{ matrix.arch }}
          path: release/${{ matrix.os }}-${{ matrix.arch }}/fabric-x-orderer-*.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs:
      - prepare
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: sha256sum *.tar.gz > checksums.txt

      - name: Publish release assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          prerelease: ${{ contains(needs.prepare.outputs.tag, '-') }}
          make_latest: ${{ needs.prepare.outputs.make_latest }}
          files: |
            dist/*.tar.gz
            dist/checksums.txt
          fail_on_unmatched_files: true
