apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: arma-prometheus
    url: http://prometheus:9090
    isDefault: true
  - name: Pyroscope
    type: grafana-pyroscope-datasource
    uid: arma-pyroscope
    url: http://pyroscope:4040
    jsonData:
      minStep: 15s
